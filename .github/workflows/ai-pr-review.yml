      - name: Build compact AI review chunks
        env:
          MODE: ${{ steps.inputs.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          # Groq organization limit:
          # 8,000 tokens per minute.
          #
          # Keep each request comfortably below that.
          # ~18,000 characters is roughly a 4.5K-5.5K token
          # input depending on the source code.

          MAX_CHARS = 18000

          def read_text(path):
              try:
                  return Path(path).read_text(
                      encoding="utf-8",
                      errors="replace"
                  )
              except Exception:
                  return ""

          with open("pr.json", encoding="utf-8") as f:
              pr = json.load(f)

          with open("files.json", encoding="utf-8") as f:
              pages = json.load(f)

          files = []

          for page in pages:
              if isinstance(page, list):
                  files.extend(page)

          mode = os.environ.get(
              "MODE",
              "review"
          )

          previous_sha = read_text(
              "previous-review-sha.txt"
          ).strip()

          # ------------------------------------------------------------
          # Small, high-value repository context.
          # ------------------------------------------------------------

          repository_context = {}

          context_candidates = [
              "README.md",
              "CONTRIBUTING.md",
              "SECURITY.md",
              "package.json",
              "tsconfig.json",
              "electron/package.json",
              "frontend/package.json"
          ]

          for name in context_candidates:

              path = Path(name)

              if not path.exists():
                  continue

              content = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              if len(content) > 3000:
                  content = (
                      content[:3000]
                      + "\n[repository context truncated]"
                  )

              repository_context[name] = content

          # ------------------------------------------------------------
          # Basic PR information included in EVERY chunk.
          # ------------------------------------------------------------

          all_changed_files = []

          for item in files:

              all_changed_files.append({
                  "filename":
                      item.get("filename", ""),

                  "status":
                      item.get("status", ""),

                  "additions":
                      item.get("additions", 0),

                  "deletions":
                      item.get("deletions", 0),

                  "changes":
                      item.get("changes", 0)
              })

          base = {
              "review_mode": mode,

              "pr": {
                  "number":
                      pr.get("number"),

                  "title":
                      pr.get("title", ""),

                  "description":
                      (pr.get("body") or "")[:6000],

                  "base_sha":
                      pr.get(
                          "base",
                          {}
                      ).get("sha"),

                  "head_sha":
                      pr.get(
                          "head",
                          {}
                      ).get("sha")
              },

              "previous_review_sha":
                  previous_sha or None,

              "all_changed_files":
                  all_changed_files,

              "repository_context":
                  repository_context
          }

          # ------------------------------------------------------------
          # Calculate serialized size.
          # ------------------------------------------------------------

          def serialized_size(items):

              payload = dict(base)

              payload[
                  "files_in_this_chunk"
              ] = items

              return len(
                  json.dumps(
                      payload,
                      ensure_ascii=False
                  )
              )

          # ------------------------------------------------------------
          # Split one gigantic patch into safe pieces.
          # ------------------------------------------------------------

          def split_large_file(item):

              patch = item.get(
                  "patch",
                  ""
              )

              if not patch:
                  return [item]

              lines = patch.splitlines(
                  keepends=True
              )

              parts = []
              current_lines = []

              for line in lines:

                  candidate_lines = (
                      current_lines
                      + [line]
                  )

                  candidate = dict(item)

                  candidate[
                      "patch"
                  ] = "".join(
                      candidate_lines
                  )

                  # Leave some room for metadata.
                  if (
                      current_lines
                      and serialized_size(
                          [candidate]
                      ) > MAX_CHARS
                  ):

                      parts.append(
                          "".join(
                              current_lines
                          )
                      )

                      current_lines = [
                          line
                      ]

                  else:

                      current_lines = (
                          candidate_lines
                      )

              if current_lines:
                  parts.append(
                      "".join(
                          current_lines
                      )
                  )

              result = []

              total = len(parts)

              for index, patch_part in enumerate(
                  parts,
                  1
              ):

                  split_item = {
                      "filename":
                          item.get(
                              "filename",
                              ""
                          )
                          + (
                              f" [patch part "
                              f"{index}/{total}]"
                          ),

                      "status":
                          item.get(
                              "status",
                              ""
                          ),

                      "additions":
                          item.get(
                              "additions",
                              0
                          ),

                      "deletions":
                          item.get(
                              "deletions",
                              0
                          ),

                      "changes":
                          item.get(
                              "changes",
                              0
                          ),

                      "patch":
                          patch_part
                  }

                  result.append(
                      split_item
                  )

              return result

          # ------------------------------------------------------------
          # Build chunks.
          #
          # First convert every huge file into safe file pieces.
          # Then pack those pieces together without exceeding MAX_CHARS.
          # ------------------------------------------------------------

          normalized_files = []

          for original in files:

              item = {
                  "filename":
                      original.get(
                          "filename",
                          ""
                      ),

                  "status":
                      original.get(
                          "status",
                          ""
                      ),

                  "additions":
                      original.get(
                          "additions",
                          0
                      ),

                  "deletions":
                      original.get(
                          "deletions",
                          0
                      ),

                  "changes":
                      original.get(
                          "changes",
                          0
                      ),

                  "patch":
                      original.get(
                          "patch",
                          ""
                      ) or ""
              }

              # If it fits, keep it intact.
              if serialized_size([item]) <= MAX_CHARS:

                  normalized_files.append(
                      item
                  )

              else:

                  # Otherwise split it safely.
                  normalized_files.extend(
                      split_large_file(item)
                  )

          chunks = []
          current = []

          for item in normalized_files:

              candidate = (
                  current
                  + [item]
              )

              # If adding this item would exceed the limit,
              # finalize the current chunk.
              if (
                  current
                  and serialized_size(
                      candidate
                  ) > MAX_CHARS
              ):

                  chunks.append(
                      current
                  )

                  current = [
                      item
                  ]

              else:

                  current = candidate

          # Add final chunk.
          if current:
              chunks.append(
                  current
              )

          # A PR with zero changed files should still produce one
          # review request.
          if not chunks:
              chunks = [[]]

          # ------------------------------------------------------------
          # Write chunks.
          # ------------------------------------------------------------

          output = Path(
              "review-chunks"
          )

          output.mkdir(
              exist_ok=True
          )

          # Clean old chunks.
          for old in output.glob(
              "chunk-*.json"
          ):

              old.unlink()

          total_chunks = len(
              chunks
          )

          for index, items in enumerate(
              chunks,
              1
          ):

              payload = dict(
                  base
              )

              payload[
                  "chunk_number"
              ] = index

              payload[
                  "total_chunks"
              ] = total_chunks

              payload[
                  "files_in_this_chunk"
              ] = items

              output_file = (
                  output
                  / f"chunk-{index:03d}.json"
              )

              output_file.write_text(
                  json.dumps(
                      payload,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

          Path(
              "chunk-count.txt"
          ).write_text(
              str(total_chunks),
              encoding="utf-8"
          )

          print(
              "Changed files:",
              len(files)
          )

          print(
              "Normalized file pieces:",
              len(normalized_files)
          )

          print(
              "Review chunks:",
              total_chunks
          )

          for path in sorted(
              output.glob(
                  "chunk-*.json"
              )
          ):

              size = len(
                  path.read_text(
                      encoding="utf-8"
                  )
              )

              print(
                  path.name,
                  size,
                  "characters"
              )
          PY
