name: Sync GitHub Issues to Discord Forum

on:
workflow_dispatch:

permissions:
contents: read
issues: read

jobs:
sync:
runs-on: ubuntu-latest

```
env:
  DISCORD_TOKEN: "${{ secrets.DISCORD_TOKEN }}"
  GITHUB_TOKEN: "${{ github.token }}"
  DISCORD_FORUM_ID: "1545409517745995886"
  REPOSITORY: "${{ github.repository }}"

steps:
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.x"

  - name: Install dependencies
    run: python -m pip install requests

  - name: Sync GitHub Issues
    shell: bash
    run: |
      python <<'PY'
      import os
      import sys
      import requests

      discord_token = os.environ["DISCORD_TOKEN"]
      github_token = os.environ["GITHUB_TOKEN"]
      forum_id = os.environ["DISCORD_FORUM_ID"]
      repository = os.environ["REPOSITORY"]

      discord_headers = {
          "Authorization": f"Bot {discord_token}",
          "Content-Type": "application/json"
      }

      github_headers = {
          "Authorization": f"Bearer {github_token}",
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28"
      }

      discord_base = "https://discord.com/api/v10"
      github_base = f"https://api.github.com/repos/{repository}"


      def split_text(text, limit=1900):
          chunks = []

          while len(text) > limit:
              cut = text.rfind("\n", 0, limit)

              if cut <= 0:
                  cut = text.rfind(" ", 0, limit)

              if cut <= 0:
                  cut = limit

              chunks.append(text[:cut].rstrip())
              text = text[cut:].lstrip()

          if text:
              chunks.append(text)

          return chunks


      def discord_request(method, url, **kwargs):
          response = requests.request(
              method,
              url,
              headers=discord_headers,
              timeout=30,
              **kwargs
          )

          if not response.ok:
              print(f"Discord API error {response.status_code}: {response.text}")

          return response


      print("Fetching open GitHub issues...")

      issues_response = requests.get(
          f"{github_base}/issues",
          headers=github_headers,
          params={
              "state": "open",
              "per_page": 100
          },
          timeout=30
      )

      issues_response.raise_for_status()

      issues = [
          issue
          for issue in issues_response.json()
          if "pull_request" not in issue
      ]

      print(f"Found {len(issues)} open issues.")


      print("Fetching Discord forum tags...")

      tags_response = discord_request(
          "GET",
          f"{discord_base}/channels/{forum_id}"
      )

      tags_response.raise_for_status()

      forum_data = tags_response.json()
      available_tags = forum_data.get("available_tags", [])

      tag_map = {}

      for tag in available_tags:
          tag_name = tag.get("name", "").strip().lower()

          if tag_name:
              tag_map[tag_name] = tag["id"]


      print("Creating missing GitHub label tags...")

      github_labels = set()

      for issue in issues:
          for label in issue.get("labels", []):
              name = label.get("name", "").strip()

              if name:
                  github_labels.add(name)


      for label_name in sorted(github_labels):
          normalized = label_name.lower()

          if normalized in tag_map:
              continue

          if len(available_tags) >= 20:
              print("Discord forum already has 20 tags. Cannot create more.")
              continue

          discord_tag_name = label_name[:20].strip()

          create_tag = {
              "name": discord_tag_name,
              "moderated": False
          }

          updated_tags = available_tags + [create_tag]

          update_response = discord_request(
              "PATCH",
              f"{discord_base}/channels/{forum_id}",
              json={
                  "available_tags": updated_tags
              }
          )

          if not update_response.ok:
              print(f"Failed to create tag: {label_name}")
              continue

          forum_data = update_response.json()
          available_tags = forum_data.get("available_tags", [])

          tag_map = {
              tag.get("name", "").strip().lower(): tag["id"]
              for tag in available_tags
              if tag.get("name")
          }

          print(f"Created Discord tag: {discord_tag_name}")


      print("Finding every existing forum post...")


      all_threads = {}
      active_url = f"{discord_base}/guilds/{forum_data['guild_id']}/threads/active"

      active_response = discord_request(
          "GET",
          active_url
      )

      if active_response.ok:
          for thread in active_response.json().get("threads", []):
              if str(thread.get("parent_id")) == str(forum_id):
                  all_threads[thread["id"]] = thread


      before = None

      while True:
          params = {
              "limit": 100
          }

          if before:
              params["before"] = before

          archived_response = discord_request(
              "GET",
              f"{discord_base}/channels/{forum_id}/threads/archived/public",
              params=params
          )

          if not archived_response.ok:
              print("Could not fetch archived forum posts.")
              break

          archived_data = archived_response.json()
          threads = archived_data.get("threads", [])

          if not threads:
              break

          for thread in threads:
              all_threads[thread["id"]] = thread

          if not archived_data.get("has_more"):
              break

          oldest = threads[-1]
          before = oldest.get("archive_timestamp")

          if not before:
              break


      print(f"Found {len(all_threads)} existing forum posts.")


      print("Deleting EVERY existing forum post...")

      delete_failures = 0

      for thread_id in list(all_threads.keys()):
          delete_response = discord_request(
              "DELETE",
              f"{discord_base}/channels/{thread_id}"
          )

          if delete_response.ok:
              print(f"Deleted forum post: {thread_id}")
          else:
              delete_failures += 1
              print(f"FAILED to delete forum post: {thread_id}")


      if delete_failures:
          print(f"{delete_failures} forum posts failed to delete.")
          sys.exit(1)


      print("All existing forum posts deleted.")


      print("Creating forum posts for open GitHub issues...")


      created = 0

      for issue in issues:
          issue_number = issue["number"]
          title = issue["title"]
          body = issue.get("body") or ""
          html_url = issue["html_url"]

          labels = [
              label.get("name", "").strip()
              for label in issue.get("labels", [])
              if label.get("name")
          ]

          content = (
              f"## 🟢 OPEN\n\n"
              f"**GitHub Issue #{issue_number}: {title}**\n\n"
              f"{body}\n\n"
              f"**Labels:** {', '.join(labels) if labels else 'None'}\n\n"
              f"**View on GitHub:** {html_url}"
          )

          chunks = split_text(content)

          if not chunks:
              chunks = ["## 🟢 OPEN\n\nNo issue content."]


          tag_ids = []

          for label in labels:
              tag_id = tag_map.get(label.lower())

              if tag_id and tag_id not in tag_ids:
                  tag_ids.append(tag_id)

          tag_ids = tag_ids[:5]


          thread_payload = {
              "name": f"#{issue_number} - {title}"[:100],
              "message": {
                  "content": chunks[0]
              }
          }

          if tag_ids:
              thread_payload["applied_tags"] = tag_ids


          create_response = discord_request(
              "POST",
              f"{discord_base}/channels/{forum_id}/threads",
              json=thread_payload
          )

          if not create_response.ok:
              print(f"FAILED to create issue #{issue_number}")
              continue

          thread = create_response.json()
          thread_id = thread["id"]


          for chunk in chunks[1:]:
              message_response = discord_request(
                  "POST",
                  f"{discord_base}/channels/{thread_id}/messages",
                  json={
                      "content": chunk
                  }
              )

              if not message_response.ok:
                  print(
                      f"FAILED to add message chunk "
                      f"to issue #{issue_number}"
                  )
                  break


          created += 1
          print(f"Created issue #{issue_number}: {title}")


      print("")
      print("================================")
      print("Discord forum sync completed.")
      print(f"Open GitHub issues: {len(issues)}")
      print(f"Forum posts created: {created}")
      print("Closed issues were not included.")
      print("================================")
      PY
```
