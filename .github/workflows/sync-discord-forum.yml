name: Sync GitHub Issues to Discord Forum

on:
workflow_dispatch:

jobs:
sync:
runs-on: ubuntu-latest

```
permissions:
  contents: read
  issues: read

steps:
  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.x"

  - name: Install requests
    run: python -m pip install requests

  - name: Sync Discord Forum
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      DISCORD_FORUM_ID: "1545409517745995886"
      REPOSITORY: ${{ github.repository }}
    shell: bash
    run: |
      python <<'PY'
      import os
      import sys
      import requests

      DISCORD = "https://discord.com/api/v10"
      GITHUB = "https://api.github.com"

      discord_token = os.environ["DISCORD_TOKEN"]
      github_token = os.environ["GITHUB_TOKEN"]
      forum_id = os.environ["DISCORD_FORUM_ID"]
      repository = os.environ["REPOSITORY"]

      discord_headers = {
          "Authorization": "Bot " + discord_token,
          "Content-Type": "application/json"
      }

      github_headers = {
          "Authorization": "Bearer " + github_token,
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28"
      }

      def discord(method, url, **kwargs):
          r = requests.request(
              method,
              url,
              headers=discord_headers,
              timeout=30,
              **kwargs
          )

          if not r.ok:
              print("Discord error:", r.status_code, r.text)

          return r

      def chunks(text, limit=1900):
          result = []

          while len(text) > limit:
              cut = text.rfind("\n", 0, limit)

              if cut < 1:
                  cut = text.rfind(" ", 0, limit)

              if cut < 1:
                  cut = limit

              result.append(text[:cut].rstrip())
              text = text[cut:].lstrip()

          if text:
              result.append(text)

          return result

      print("Getting open GitHub issues...")

      r = requests.get(
          GITHUB + "/repos/" + repository + "/issues",
          headers=github_headers,
          params={
              "state": "open",
              "per_page": 100
          },
          timeout=30
      )

      r.raise_for_status()

      issues = [
          issue
          for issue in r.json()
          if "pull_request" not in issue
      ]

      print("Open issues:", len(issues))

      print("Getting forum information...")

      r = discord(
          "GET",
          DISCORD + "/channels/" + forum_id
      )

      r.raise_for_status()

      forum = r.json()
      guild_id = forum["guild_id"]
      available_tags = forum.get("available_tags", [])

      tag_map = {}

      for tag in available_tags:
          name = tag.get("name", "").strip().lower()

          if name:
              tag_map[name] = tag["id"]

      labels = {}

      for issue in issues:
          for label in issue.get("labels", []):
              name = label.get("name", "").strip()

              if name:
                  labels[name] = True

      print("GitHub labels:", len(labels))

      for label_name in sorted(labels):
          key = label_name.lower()

          if key in tag_map:
              continue

          if len(available_tags) >= 20:
              print("Discord tag limit reached.")
              break

          tag_name = label_name[:20].strip()

          if not tag_name:
              continue

          if any(
              t.get("name", "").strip().lower() == tag_name.lower()
              for t in available_tags
          ):
              continue

          new_tags = list(available_tags)

          new_tags.append({
              "name": tag_name,
              "moderated": False
          })

          r = discord(
              "PATCH",
              DISCORD + "/channels/" + forum_id,
              json={
                  "available_tags": new_tags
              }
          )

          if not r.ok:
              print("Could not create tag:", tag_name)
              continue

          forum = r.json()
          available_tags = forum.get("available_tags", [])

          tag_map = {}

          for tag in available_tags:
              name = tag.get("name", "").strip().lower()

              if name:
                  tag_map[name] = tag["id"]

          tag_map[key] = next(
              (
                  tag["id"]
                  for tag in available_tags
                  if tag.get("name", "").strip().lower()
                  == tag_name.lower()
              ),
              None
          )

          print("Created tag:", tag_name)

      print("Finding active forum posts...")

      all_threads = {}

      r = discord(
          "GET",
          DISCORD + "/guilds/" + guild_id + "/threads/active"
      )

      if r.ok:
          for thread in r.json().get("threads", []):
              if str(thread.get("parent_id")) == str(forum_id):
                  all_threads[thread["id"]] = thread

      print("Finding archived forum posts...")

      before = None

      while True:
          params = {
              "limit": 100
          }

          if before:
              params["before"] = before

          r = discord(
              "GET",
              DISCORD + "/channels/" + forum_id +
              "/threads/archived/public",
              params=params
          )

          if not r.ok:
              print("Could not get archived posts.")
              break

          data = r.json()
          threads = data.get("threads", [])

          if not threads:
              break

          for thread in threads:
              all_threads[thread["id"]] = thread

          if not data.get("has_more"):
              break

          before = threads[-1].get("archive_timestamp")

          if not before:
              break

      print("Existing forum posts:", len(all_threads))

      print("Deleting EVERY forum post...")

      failures = 0

      for thread_id in list(all_threads):
          r = discord(
              "DELETE",
              DISCORD + "/channels/" + thread_id
          )

          if r.ok:
              print("Deleted:", thread_id)
          else:
              failures += 1
              print("FAILED:", thread_id)

      if failures:
          print("Deletion failures:", failures)
          sys.exit(1)

      print("All existing forum posts deleted.")

      print("Creating posts for OPEN issues only...")

      created = 0

      for issue in issues:
          number = issue["number"]
          title = issue["title"]
          body = issue.get("body") or ""
          url = issue["html_url"]

          issue_labels = [
              label.get("name", "").strip()
              for label in issue.get("labels", [])
              if label.get("name")
          ]

          text = (
              "## 🟢 OPEN\n\n"
              "**GitHub Issue #" + str(number) +
              ": " + title + "**\n\n" +
              body +
              "\n\n**Labels:** " +
              (", ".join(issue_labels) if issue_labels else "None") +
              "\n\n**View on GitHub:** " +
              url
          )

          message_chunks = chunks(text)

          applied_tags = []

          for label in issue_labels:
              tag_id = tag_map.get(label.lower())

              if tag_id and tag_id not in applied_tags:
                  applied_tags.append(tag_id)

          applied_tags = applied_tags[:5]

          payload = {
              "name": ("#" + str(number) + " - " + title)[:100],
              "message": {
                  "content": message_chunks[0]
              }
          }

          if applied_tags:
              payload["applied_tags"] = applied_tags

          r = discord(
              "POST",
              DISCORD + "/channels/" + forum_id + "/threads",
              json=payload
          )

          if not r.ok:
              print("FAILED creating issue:", number)
              continue

          thread_id = r.json()["id"]

          for part in message_chunks[1:]:
              r = discord(
                  "POST",
                  DISCORD + "/channels/" + thread_id + "/messages",
                  json={
                      "content": part
                  }
              )

              if not r.ok:
                  print("FAILED adding content to issue:", number)
                  break

          created += 1
          print("Created issue:", number)

      print("")
      print("SYNC COMPLETE")
      print("Open issues:", len(issues))
      print("Posts created:", created)
      print("Closed issues skipped.")
      PY
