name: Sync GitHub Issues to Discord Forum

on:
workflow_dispatch:

permissions:
contents: read
issues: read

jobs:
sync:
runs-on: ubuntu-latest

```
env:
  DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
  GITHUB_TOKEN: ${{ github.token }}
  DISCORD_FORUM_ID: "1545409517745995886"
  REPOSITORY: ${{ github.repository }}

steps:
  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.x"

  - name: Install requests
    run: python -m pip install requests

  - name: Sync Issues
    shell: python
    run: |
      import os
      import sys
      import time
      import requests

      DISCORD_TOKEN = os.environ["DISCORD_TOKEN"]
      GITHUB_TOKEN = os.environ["GITHUB_TOKEN"]
      FORUM_ID = os.environ["DISCORD_FORUM_ID"]
      REPOSITORY = os.environ["REPOSITORY"]

      DISCORD_API = "https://discord.com/api/v10"
      GITHUB_API = "https://api.github.com"

      discord_headers = {
          "Authorization": f"Bot {DISCORD_TOKEN}",
          "Content-Type": "application/json"
      }

      github_headers = {
          "Authorization": f"Bearer {GITHUB_TOKEN}",
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28"
      }

      def discord_request(method, url, **kwargs):
          while True:
              response = requests.request(
                  method,
                  url,
                  headers=discord_headers,
                  **kwargs
              )

              if response.status_code == 429:
                  try:
                      retry_after = float(
                          response.json().get("retry_after", 1)
                      )
                  except Exception:
                      retry_after = 1

                  print(f"Rate limited. Waiting {retry_after} seconds.")
                  time.sleep(retry_after + 0.5)
                  continue

              return response

      def github_request(url, params=None):
          response = requests.get(
              url,
              headers=github_headers,
              params=params
          )

          if not response.ok:
              print(
                  f"GitHub API error {response.status_code}: "
                  f"{response.text}"
              )
              sys.exit(1)

          return response.json()

      def split_text(text, limit=1900):
          parts = []

          while len(text) > limit:
              position = text.rfind("\n", 0, limit)

              if position < 500:
                  position = text.rfind(" ", 0, limit)

              if position < 500:
                  position = limit

              parts.append(text[:position].rstrip())
              text = text[position:].lstrip()

          if text:
              parts.append(text)

          return parts

      print("Checking Discord forum...")

      forum_response = discord_request(
          "GET",
          f"{DISCORD_API}/channels/{FORUM_ID}"
      )

      if not forum_response.ok:
          print(forum_response.text)
          sys.exit(1)

      forum = forum_response.json()

      if forum.get("type") != 15:
          print("The specified channel is not a Forum channel.")
          sys.exit(1)

      print(f"Forum: {forum.get('name')}")

      print("Getting open GitHub issues...")

      issues = []

      for page in range(1, 101):
          page_data = github_request(
              f"{GITHUB_API}/repos/{REPOSITORY}/issues",
              {
                  "state": "open",
                  "per_page": 100,
                  "page": page
              }
          )

          if not page_data:
              break

          issues.extend(page_data)

          if len(page_data) < 100:
              break

      issues = [
          issue
          for issue in issues
          if "pull_request" not in issue
      ]

      issues.sort(key=lambda issue: issue["number"])

      print(f"Open issues: {len(issues)}")

      github_labels = {}

      for issue in issues:
          for label in issue.get("labels", []):
              name = label.get("name", "").strip()

              if name:
                  github_labels[name.lower()] = name

      existing_tags = {}

      for tag in forum.get("available_tags", []):
          name = tag.get("name", "").strip()

          if name:
              existing_tags[name.lower()] = tag["id"]

      print("Creating missing Discord tags...")

      for normalized, original in sorted(github_labels.items()):

          if normalized in existing_tags:
              continue

          current_tags = forum.get("available_tags", [])

          if len(current_tags) >= 20:
              break

          tag_name = original[:20].strip()

          if not tag_name:
              continue

          if tag_name.lower() in existing_tags:
              continue

          new_tags = []

          for tag in current_tags:
              tag_data = {
                  "id": tag["id"],
                  "name": tag["name"],
                  "moderated": tag.get("moderated", False)
              }

              if tag.get("emoji_id") is not None:
                  tag_data["emoji_id"] = tag["emoji_id"]

              if tag.get("emoji_name") is not None:
                  tag_data["emoji_name"] = tag["emoji_name"]

              new_tags.append(tag_data)

          new_tags.append({
              "name": tag_name,
              "moderated": False
          })

          response = discord_request(
              "PATCH",
              f"{DISCORD_API}/channels/{FORUM_ID}",
              json={
                  "available_tags": new_tags
              }
          )

          if response.ok:
              forum = response.json()

              existing_tags = {}

              for tag in forum.get("available_tags", []):
                  name = tag.get("name", "").strip()

                  if name:
                      existing_tags[name.lower()] = tag["id"]

          else:
              print(
                  f"Could not create tag {tag_name}: "
                  f"{response.status_code}"
              )

          time.sleep(0.5)

      print("Finding all existing forum posts...")

      threads = {}

      active_response = discord_request(
          "GET",
          f"{DISCORD_API}/guilds/{forum['guild_id']}/threads/active"
      )

      if active_response.ok:
          for thread in active_response.json().get("threads", []):
              if thread.get("parent_id") == FORUM_ID:
                  threads[thread["id"]] = thread

      before = None

      while True:
          params = {
              "limit": 100
          }

          if before:
              params["before"] = before

          archived_response = discord_request(
              "GET",
              f"{DISCORD_API}/channels/{FORUM_ID}/threads/archived/public",
              params=params
          )

          if not archived_response.ok:
              print(
                  f"Could not get archived posts: "
                  f"{archived_response.status_code}"
              )
              break

          archived_data = archived_response.json()

          archived_threads = archived_data.get("threads", [])

          if not archived_threads:
              break

          for thread in archived_threads:
              threads[thread["id"]] = thread

          if not archived_data.get("has_more", False):
              break

          before = archived_threads[-1]["id"]

      print(f"Forum posts found: {len(threads)}")

      deleted = 0

      for thread_id, thread in list(threads.items()):

          print(
              f"Deleting: {thread.get('name', thread_id)}"
          )

          delete_response = discord_request(
              "DELETE",
              f"{DISCORD_API}/channels/{thread_id}"
          )

          if (
              delete_response.ok
              or delete_response.status_code == 404
          ):
              deleted += 1
          else:
              print(
                  f"Failed to delete {thread_id}: "
                  f"{delete_response.status_code}"
              )
              print(delete_response.text)

          time.sleep(0.4)

      print(f"Deleted posts: {deleted}")

      created = 0
      failed = 0

      for issue in issues:

          number = issue["number"]
          title = issue["title"].strip()
          body = issue.get("body") or "No description provided."

          labels = issue.get("labels", [])

          label_text = []

          for label in labels:
              name = label.get("name", "").strip()

              if name:
                  label_text.append(name)

          if label_text:
              labels_section = "Labels: " + ", ".join(label_text)
          else:
              labels_section = "Labels: None"

          content = (
              "## 🟢 OPEN\n\n"
              f"GitHub Issue #{number}\n\n"
              f"{body}\n\n"
              f"{labels_section}\n\n"
              f"View on GitHub: {issue['html_url']}"
          )

          chunks = split_text(content)

          tag_ids = []

          for label in labels:
              name = label.get("name", "").strip().lower()

              if name in existing_tags:
                  tag_id = existing_tags[name]

                  if tag_id not in tag_ids:
                      tag_ids.append(tag_id)

          tag_ids = tag_ids[:5]

          thread_name = f"#{number} — {title}"[:100]

          payload = {
              "name": thread_name,
              "message": {
                  "content": chunks[0]
              }
          }

          if tag_ids:
              payload["applied_tags"] = tag_ids

          print(
              f"Creating #{number}: {title}"
          )

          create_response = discord_request(
              "POST",
              f"{DISCORD_API}/channels/{FORUM_ID}/threads",
              json=payload
          )

          if not create_response.ok:
              print(
                  f"Failed to create #{number}: "
                  f"{create_response.status_code}"
              )
              print(create_response.text)
              failed += 1
              continue

          created += 1

          thread_data = create_response.json()
          thread_id = thread_data["id"]

          for chunk in chunks[1:]:

              message_response = discord_request(
                  "POST",
                  f"{DISCORD_API}/channels/{thread_id}/messages",
                  json={
                      "content": chunk
                  }
              )

              if not message_response.ok:
                  print(
                      f"Failed to send additional content "
                      f"for #{number}: "
                      f"{message_response.status_code}"
                  )
                  print(message_response.text)
                  failed += 1
                  break

              time.sleep(0.3)

          time.sleep(0.5)

      print("")
      print("========================================")
      print("Voxel+ Discord Sync Complete")
      print("========================================")
      print(f"Open GitHub issues: {len(issues)}")
      print(f"Posts deleted: {deleted}")
      print(f"Posts created: {created}")
      print(f"Failed operations: {failed}")
      print("========================================")
```
