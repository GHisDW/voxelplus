name: Sync GitHub Issues to Discord Forum

on:
workflow_dispatch:

permissions:
contents: read
issues: read

jobs:
sync:
runs-on: ubuntu-latest


env:
  DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
  GITHUB_TOKEN: ${{ github.token }}
  DISCORD_FORUM_ID: "1545409517745995886"
  REPOSITORY: ${{ github.repository }}

steps:
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.x"

  - name: Install dependencies
    run: python -m pip install requests

  - name: Sync GitHub Issues to Discord
    shell: python
    run: |
      import os
      import sys
      import time
      import requests

      DISCORD_TOKEN = os.environ["DISCORD_TOKEN"]
      GITHUB_TOKEN = os.environ["GITHUB_TOKEN"]
      FORUM_ID = os.environ["DISCORD_FORUM_ID"]
      REPO = os.environ["REPOSITORY"]

      DISCORD_API = "https://discord.com/api/v10"
      GITHUB_API = "https://api.github.com"

      discord_headers = {
          "Authorization": f"Bot {DISCORD_TOKEN}",
          "Content-Type": "application/json",
      }

      github_headers = {
          "Authorization": f"Bearer {GITHUB_TOKEN}",
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
      }

      def discord_request(method, url, **kwargs):
          while True:
              response = requests.request(
                  method,
                  url,
                  headers=discord_headers,
                  **kwargs
              )

              if response.status_code == 429:
                  try:
                      retry_after = response.json().get(
                          "retry_after",
                          1
                      )
                  except Exception:
                      retry_after = 1

                  print(
                      f"Rate limited. Waiting "
                      f"{retry_after} seconds..."
                  )

                  time.sleep(float(retry_after) + 0.25)
                  continue

              return response

      def github_get(url, params=None):
          response = requests.get(
              url,
              headers=github_headers,
              params=params
          )

          if not response.ok:
              print(
                  f"GitHub API error "
                  f"{response.status_code}: "
                  f"{response.text}"
              )
              response.raise_for_status()

          return response.json()

      def split_message(text, limit=1900):
          chunks = []

          while len(text) > limit:
              split_at = text.rfind(
                  "\n",
                  0,
                  limit
              )

              if split_at < limit * 0.5:
                  split_at = text.rfind(
                      " ",
                      0,
                      limit
                  )

              if split_at < limit * 0.5:
                  split_at = limit

              chunk = text[:split_at].rstrip()

              if not chunk:
                  chunk = text[:limit]

              chunks.append(chunk)
              text = text[split_at:].lstrip()

          if text:
              chunks.append(text)

          return chunks

      print("========================================")
      print(" Voxel+ GitHub -> Discord Forum Sync")
      print("========================================")

      # ------------------------------------------------------------
      # 1. Check the Discord forum
      # ------------------------------------------------------------

      print("\nChecking Discord forum...")

      forum_response = discord_request(
          "GET",
          f"{DISCORD_API}/channels/{FORUM_ID}"
      )

      if not forum_response.ok:
          print(
              "Could not access Discord forum:"
              f" {forum_response.status_code}"
          )
          print(forum_response.text)
          sys.exit(1)

      forum = forum_response.json()

      if forum.get("type") != 15:
          print(
              "ERROR: The configured channel is "
              "not a Forum channel."
          )
          sys.exit(1)

      print(
          f"Forum found: #{forum.get('name')}"
      )

      # ------------------------------------------------------------
      # 2. Fetch all OPEN GitHub issues
      # ------------------------------------------------------------

      print("\nFetching OPEN GitHub issues...")

      issues = []

      for page in range(1, 100):
          page_issues = github_get(
              f"{GITHUB_API}/repos/{REPO}/issues",
              params={
                  "state": "open",
                  "per_page": 100,
                  "page": page,
              }
          )

          if not page_issues:
              break

          issues.extend(page_issues)

          if len(page_issues) < 100:
              break

      issues = [
          issue
          for issue in issues
          if "pull_request" not in issue
      ]

      issues.sort(
          key=lambda issue: issue["number"]
      )

      print(
          f"Open issues found: {len(issues)}"
      )

      # ------------------------------------------------------------
      # 3. Get GitHub labels
      # ------------------------------------------------------------

      github_labels = {}

      for issue in issues:
          for label in issue.get("labels", []):
              name = label.get(
                  "name",
                  ""
              ).strip()

              if name:
                  github_labels[name.lower()] = name

      print(
          f"GitHub labels found: "
          f"{len(github_labels)}"
      )

      # ------------------------------------------------------------
      # 4. Get current Discord forum tags
      # ------------------------------------------------------------

      existing_tags = {}

      for tag in forum.get(
          "available_tags",
          []
      ):
          name = tag.get(
              "name",
              ""
          ).strip()

          if name:
              existing_tags[name.lower()] = tag["id"]

      # ------------------------------------------------------------
      # 5. Create missing Discord tags
      # ------------------------------------------------------------

      for normalized_name, original_name in sorted(
          github_labels.items()
      ):

          if normalized_name in existing_tags:
              continue

          current_tags = forum.get(
              "available_tags",
              []
          )

          if len(current_tags) >= 20:
              print(
                  "Discord has reached its "
                  "20-tag limit."
              )
              break

          tag_name = original_name[:20].strip()

          if not tag_name:
              continue

          if tag_name.lower() in existing_tags:
              continue

          print(
              f"Creating Discord tag: "
              f"{tag_name}"
          )

          new_tags = []

          for tag in current_tags:
              tag_data = {
                  "id": tag["id"],
                  "name": tag["name"],
                  "moderated": tag.get(
                      "moderated",
                      False
                  ),
              }

              if tag.get("emoji_id"):
                  tag_data["emoji_id"] = (
                      tag["emoji_id"]
                  )

              if tag.get("emoji_name"):
                  tag_data["emoji_name"] = (
                      tag["emoji_name"]
                  )

              new_tags.append(tag_data)

          new_tags.append({
              "name": tag_name,
              "moderated": False,
          })

          update_response = discord_request(
              "PATCH",
              f"{DISCORD_API}/channels/{FORUM_ID}",
              json={
                  "available_tags": new_tags
              }
          )

          if not update_response.ok:
              print(
                  f"Could not create tag "
                  f"{tag_name}: "
                  f"{update_response.status_code}"
              )
              print(update_response.text)
              continue

          forum = update_response.json()

          existing_tags = {}

          for tag in forum.get(
              "available_tags",
              []
          ):
              name = tag.get(
                  "name",
                  ""
              ).strip()

              if name:
                  existing_tags[
                      name.lower()
                  ] = tag["id"]

          time.sleep(0.5)

      # ------------------------------------------------------------
      # 6. Get EVERY forum post
      # ------------------------------------------------------------

      print("\nFinding ALL existing forum posts...")

      all_threads = {}

      # Active forum posts
      active_response = discord_request(
          "GET",
          f"{DISCORD_API}/guilds/"
          f"{forum['guild_id']}/threads/active"
      )

      if active_response.ok:
          active_threads = (
              active_response.json()
              .get("threads", [])
          )

          for thread in active_threads:
              if thread.get(
                  "parent_id"
              ) == FORUM_ID:
                  all_threads[
                      thread["id"]
                  ] = thread

      # Archived forum posts
      before = None

      while True:
          params = {
              "limit": 100
          }

          if before:
              params["before"] = before

          archived_response = discord_request(
              "GET",
              f"{DISCORD_API}/channels/"
              f"{FORUM_ID}/threads/"
              f"archived/public",
              params=params
          )

          if not archived_response.ok:
              print(
                  "Could not retrieve archived "
                  "forum posts:"
              )
              print(
                  archived_response.text
              )
              break

          archived_data = (
              archived_response.json()
          )

          archived_threads = (
              archived_data.get(
                  "threads",
                  []
              )
          )

          if not archived_threads:
              break

          for thread in archived_threads:
              all_threads[
                  thread["id"]
              ] = thread

          if not archived_data.get(
              "has_more"
          ):
              break

          before = archived_threads[-1]["id"]

      print(
          f"Total forum posts found: "
          f"{len(all_threads)}"
      )

      # ------------------------------------------------------------
      # 7. DELETE EVERY FORUM POST
      # ------------------------------------------------------------

      deleted = 0

      for thread_id, thread in all_threads.items():

          print(
              f"Deleting forum post: "
              f"{thread.get('name', thread_id)}"
          )

          delete_response = discord_request(
              "DELETE",
              f"{DISCORD_API}/channels/"
              f"{thread_id}"
          )

          if (
              delete_response.ok
              or delete_response.status_code == 404
          ):
              deleted += 1
          else:
              print(
                  f"Failed to delete "
                  f"{thread_id}: "
                  f"{delete_response.status_code}"
              )
              print(
                  delete_response.text
              )

          time.sleep(0.5)

      print(
          f"Deleted forum posts: {deleted}"
      )

      # ------------------------------------------------------------
      # 8. Create posts for OPEN issues
      # ------------------------------------------------------------

      created = 0
      failed = 0
      messages_created = 0

      for issue in issues:

          number = issue["number"]
          title = issue["title"].strip()
          body = issue.get("body") or (
              "_No description provided._"
          )

          labels = issue.get(
              "labels",
              []
          )

          label_names = []

          for label in labels:
              label_name = label.get(
                  "name",
                  ""
              ).strip()

              if label_name:
                  label_names.append(
                      f"`{label_name}`"
                  )

          labels_text = (
              ", ".join(label_names)
              if label_names
              else "_No labels_"
          )

          content = f"""## 🟢 OPEN

      **GitHub Issue #{number}**

      {body}

      **Labels:** {labels_text}

      🔗 [View on GitHub]({issue["html_url"]})
      """

          chunks = split_message(
              content,
              limit=1900
          )

          if not chunks:
              chunks = [
                  f"GitHub Issue #{number}"
              ]

          # --------------------------------------------------------
          # Find matching Discord tags
          # --------------------------------------------------------

          applied_tag_ids = []

          for label in labels:
              label_name = label.get(
                  "name",
                  ""
              ).strip().lower()

              if label_name in existing_tags:
                  tag_id = existing_tags[
                      label_name
                  ]

                  if tag_id not in applied_tag_ids:
                      applied_tag_ids.append(
                          tag_id
                      )

          applied_tag_ids = (
              applied_tag_ids[:5]
          )

          # --------------------------------------------------------
          # Create forum post
          # --------------------------------------------------------

          thread_name = (
              f"#{number} — {title}"
          )[:100]

          payload = {
              "name": thread_name,
              "message": {
                  "content": chunks[0]
              },
          }

          if applied_tag_ids:
              payload[
                  "applied_tags"
              ] = applied_tag_ids

          print(
              f"Creating #{number}: "
              f"{title}"
          )

          create_response = discord_request(
              "POST",
              f"{DISCORD_API}/channels/"
              f"{FORUM_ID}/threads",
              json=payload
          )

          if not create_response.ok:
              print(
                  f"Failed to create "
                  f"#{number}: "
                  f"{create_response.status_code}"
              )
              print(
                  create_response.text
              )
              failed += 1
              continue

          thread_data = (
              create_response.json()
          )

          thread_id = thread_data["id"]

          created += 1
          messages_created += 1

          # --------------------------------------------------------
          # Send remaining chunks
          # --------------------------------------------------------

          for chunk in chunks[1:]:

              message_response = (
                  discord_request(
                      "POST",
                      f"{DISCORD_API}/channels/"
                      f"{thread_id}/messages",
                      json={
                          "content": chunk
                      }
                  )
              )

              if not message_response.ok:
                  print(
                      f"Failed to send "
                      f"additional content "
                      f"for #{number}: "
                      f"{message_response.status_code}"
                  )
                  print(
                      message_response.text
                  )
                  failed += 1
                  break

              messages_created += 1

              time.sleep(0.35)

          time.sleep(0.5)

      # ------------------------------------------------------------
      # 9. Final result
      # ------------------------------------------------------------

      print("\n========================================")
      print(" Sync complete!")
      print("========================================")
      print(
          f"Open GitHub issues: {len(issues)}"
      )
      print(
          f"Forum posts deleted: {deleted}"
      )
      print(
          f"Forum posts created: {created}"
      )
      print(
          f"Messages created: {messages_created}"
      )
      print(
          f"Failed operations: {failed}"
      )
      print(
          f"Discord tags: {len(existing_tags)}"
      )
      print("========================================")
 open GitHub issues come back. 💀🔥
```
